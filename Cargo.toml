[package]
name = "broma"
version = "1.0.0"
edition = "2024"
authors = ["Sayantan Banerjee"]
description = "Guilt free and efficient Soundboard"
autotests = false
license = "BSD-3-Clause"

[dependencies]
blake3 = { version = "1.8.7", features = ["pure"] }
cpal = { version = "0.18.2", features = ["pulseaudio"] }
directories = "6.0.0"
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "thread-pool", "wayland", "crisp", "web-colors"] }
png = { version = "0.18.1", default-features = false }
rfd = "0.18.0"
rtrb = "0.4.1"
rubato = "5.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["mp3", "aac", "isomp4", "alac", "aiff", "caf"] }
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts", "wayland"] }
pulseaudio = "0.3"

[target.'cfg(not(target_os = "linux"))'.dependencies]
global-hotkey = "0.10.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
