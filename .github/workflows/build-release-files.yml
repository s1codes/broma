name: Build Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x86_64)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            formats: "deb,appimage"

          - name: Linux (ARM64)
            os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
            formats: "deb,appimage"

          - name: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            formats: "nsis"

          - name: Windows (ARM64)
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            formats: "nsis"


    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libgcc-s1 \
            libc6

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        uses: baptiste0928/cargo-install@v3.5.0
        with:
          crate: cargo-packager

      - name: Build & Package final binary
        run: cargo packager --release --formats ${{ matrix.formats }}

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: broma-${{ runner.os }}-release-${{ matrix.target }}
          retention-days: 14
          path: dist/**
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: artifacts
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
