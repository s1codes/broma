name: Build release artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      architecture:
        description: Architectures to build (manual runs only)
        required: true
        type: choice
        default: x86_64
        options:
          - x86_64
          - arm64
          - all

permissions:
  contents: read

concurrency:
  group: build-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-architectures:
    name: Select architectures
    runs-on: ubuntu-24.04
    outputs:
      architectures: ${{ steps.select.outputs.architectures }}
    steps:
      - id: select
        name: Select tag or manually requested architectures
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_ARCHITECTURE: ${{ inputs.architecture }}
        run: |
          if [[ "$EVENT_NAME" == "push" || "$REQUESTED_ARCHITECTURE" == "all" ]]; then
            echo 'architectures=["x86_64","arm64"]' >> "$GITHUB_OUTPUT"
          else
            case "$REQUESTED_ARCHITECTURE" in
              x86_64|arm64)
                printf 'architectures=["%s"]\n' "$REQUESTED_ARCHITECTURE" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "Unsupported architecture: $REQUESTED_ARCHITECTURE" >&2
                exit 1
                ;;
            esac
          fi

  test:
    name: Test release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up stable Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
          cache: true

      - name: Install Linux development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Run unit tests
        run: cargo test --locked

  linux-packages:
    name: Linux packages (${{ matrix.architecture }})
    needs:
      - select-architectures
      - test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(needs.select-architectures.outputs.architectures) }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up stable Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
          cache: true

      - name: Install package and audio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils \
            dpkg-dev \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config \
            rpm

      - name: Install Cross for ARM64
        if: matrix.architecture == 'arm64'
        run: cargo install cross --locked --version 0.2.5

      - name: Build Debian and RPM packages
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: ./installer/linux/build-packages.sh "$ARCHITECTURE"

      - name: Upload Linux packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: broma-build-linux-packages-${{ matrix.architecture }}
          path: |
            dist/linux/*.deb
            dist/linux/*.rpm
          if-no-files-found: error
          retention-days: 1

  appimage:
    name: AppImage (${{ matrix.architecture }})
    needs:
      - select-architectures
      - test
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: ubuntu:22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(needs.select-architectures.outputs.architectures) }}
    steps:
      - name: Install Linux and AppImage build dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            file \
            git \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up stable Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
          cache: true

      - name: Build AppImage
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: ./installer/linux/appimage/build.sh "$ARCHITECTURE"

      - name: Upload AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: broma-build-appimage-${{ matrix.architecture }}
          path: dist/linux/*.AppImage
          if-no-files-found: error
          retention-days: 1

  windows-x64:
    name: Windows installer (x64)
    needs: test
    if: github.event_name == 'push' || inputs.architecture == 'x86_64' || inputs.architecture == 'all'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up stable Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
          cache: true

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress

      - name: Build x64 installer
        shell: pwsh
        run: .\installer\windows\build-installer.ps1 -Architecture x86_64

      - name: Upload x64 installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: broma-build-windows-x64
          path: dist/Broma-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 1

  windows-arm64:
    name: Windows installer (ARM64)
    needs: test
    if: github.event_name == 'push' || inputs.architecture == 'arm64' || inputs.architecture == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up stable Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          toolchain: stable
          cache: true

      - name: Install NSIS
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nsis

      - name: Install ARM64 Windows Rust target
        run: rustup target add aarch64-pc-windows-msvc

      - name: Install cargo-xwin
        run: cargo install cargo-xwin --locked --version 0.23.1

      - name: Build ARM64 MSVC binary
        run: cargo xwin build --locked --release --target aarch64-pc-windows-msvc

      - name: Package ARM64 installer
        shell: bash
        run: |
          VERSION="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["version"])')"
          mkdir -p dist
          makensis \
            "-DVERSION=$VERSION" \
            -DARCH_SUFFIX=arm64 \
            "-DBIN_PATH=$GITHUB_WORKSPACE/target/aarch64-pc-windows-msvc/release/broma.exe" \
            "-DAPP_ICON_PATH=$GITHUB_WORKSPACE/assets/broma.ico" \
            "-DOUT_FILE=$GITHUB_WORKSPACE/dist/Broma-Setup-$VERSION-arm64.exe" \
            installer/windows/broma.nsi

      - name: Upload ARM64 installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: broma-build-windows-arm64
          path: dist/Broma-Setup-*-arm64.exe
          if-no-files-found: error
          retention-days: 1

  release-candidate:
    name: Assemble release candidate artifacts
    needs:
      - test
      - linux-packages
      - appimage
      - windows-x64
      - windows-arm64
    if: >-
      ${{
        always() &&
        needs.test.result == 'success' &&
        needs.linux-packages.result == 'success' &&
        needs.appimage.result == 'success' &&
        (
          needs.windows-x64.result == 'success' ||
          (github.event_name == 'workflow_dispatch' && inputs.architecture == 'arm64')
        ) &&
        (
          needs.windows-arm64.result == 'success' ||
          (github.event_name == 'workflow_dispatch' && inputs.architecture == 'x86_64')
        )
      }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: broma-build-*
          merge-multiple: true
          path: release-assets

      - name: Create SHA-256 checksums
        working-directory: release-assets
        run: sha256sum -- * > SHA256SUMS.txt

      - name: Upload release-candidate bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: broma-release-candidate
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

      - name: Explain manual release step
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          {
            echo '### Release candidate is ready'
            echo "Artifacts for ref \`$GITHUB_REF_NAME\` are available as \`broma-release-candidate\`."
            echo 'No GitHub Release was created or modified. Download the bundle and attach its files to your Release when you are ready.'
          } >> "$GITHUB_STEP_SUMMARY"
